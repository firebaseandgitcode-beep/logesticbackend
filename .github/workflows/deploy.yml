name: Deploy to Firebase Functions + Firestore

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Write .env for Firebase Functions
        run: echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > functions/.env

      - name: Deploy Functions + Firestore rules + indexes
        run: >
          npx firebase-tools deploy
          --only functions,firestore
          --project mylogestic1
          --token "${{ secrets.FIREBASE_TOKEN }}"
          --non-interactive
          --force
